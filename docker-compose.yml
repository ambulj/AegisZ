version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisz-backend
    ports:
      - "8000:8000"
    environment:
      - AEGISZ_ENV=production
      - AEGISZ_HOST=0.0.0.0
      - AEGISZ_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisz-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
